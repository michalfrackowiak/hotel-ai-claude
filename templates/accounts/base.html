<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Aurora · My Account</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --green: #34a853;
      --red: #ea4335;
      --orange: #fa9c33;
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #dadce0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 1rem; }
    .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text); }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #4285f4); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.2rem; }
    .logo-text h1 { font-size: 1.25rem; font-weight: 600; }
    .logo-text span { font-size: 0.75rem; color: var(--text-secondary); }
    .nav-links { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .nav-links a { text-decoration: none; color: var(--text-secondary); font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--primary); }
    .nav-links a.active { color: var(--primary); }
    .logout-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 1rem; color: var(--text-secondary); font-size: 0.875rem; text-decoration: none; cursor: pointer; }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }
    .wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-title { font-size: 1.75rem; font-weight: 600; margin-bottom: 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.15rem; margin-bottom: 1rem; }
    .messages { list-style: none; margin-bottom: 1rem; }
    .messages li { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .messages .success { background: #e6f4ea; color: #1e7e34; }
    .messages .error { background: #fce8e6; color: #c5221f; }
    .messages .info, .messages .warning { background: #e8f0fe; color: #174ea6; }
    .field-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .field-row:last-child { border-bottom: none; }
    .field-row .label { color: var(--text-secondary); font-weight: 500; }
    .field-row .value { font-weight: 600; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.4rem; border-radius: 8px; font-size: 0.95rem; font-weight: 500; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
    form.stacked label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    form.stacked input, form.stacked select { width: 100%; max-width: 340px; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; margin-bottom: 1rem; }
    form.stacked input:focus, form.stacked select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
    .errorlist { color: var(--red); font-size: 0.85rem; margin: -0.25rem 0 0.75rem; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f1f3f4; padding: 0.6rem 0.75rem; text-align: left; font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); }
    td { padding: 0.6rem 0.75rem; border-top: 1px solid #eee; font-size: 0.9rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background: #e8f0fe; color: #174ea6; }
    .empty { padding: 2rem; text-align: center; color: var(--text-secondary); }
    .table-scroll { overflow-x: auto; }
    @media (max-width: 768px) { .wrap { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">
      <div class="logo-icon">A</div>
      <div class="logo-text">
        <h1>Hotel Aurora</h1>
        <span>Guest Portal</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="{% url 'accounts:profile' %}" class="{% if section == 'profile' %}active{% endif %}">My Bookings</a>
      <a href="{% url 'accounts:profile-update' %}" class="{% if section == 'settings' %}active{% endif %}">Settings</a>
      <a href="{% url 'account_change_password' %}" class="{% if section == 'password' %}active{% endif %}">Password</a>
      <a href="{% url 'account_logout' %}" class="logout-btn">Sign out</a>
    </nav>
  </header>

  <main class="wrap">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
