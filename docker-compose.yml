version: "3.9"

services:
  web:
    build: .
    image: hotel-ai-claude:latest
    container_name: hotel-ai-web
    env_file: .env
    ports:
      - "8888:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: hotel-ai-db
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_ai}
      POSTGRES_USER: ${DB_USER:-hotel_ai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel_ai}
    volumes:
      - db_volume:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hotel-ai-redis
    restart: unless-stopped

volumes:
  db_volume:
  static_volume: